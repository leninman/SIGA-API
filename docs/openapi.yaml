openapi: 3.0.3
info:
  title: SIGA-API
  description: |
    API REST del Sistema de Información de Gestión Académica (SIGA).

    **Base URL:** `http://localhost:8090/siga/api/v1`

    **Nota:** Varios endpoints usan GET con cuerpo JSON (no estándar HTTP).
    Importar este archivo en Postman, Swagger UI o Insomnia.
  version: 1.0.0
  contact:
    name: Tecnodestreza

servers:
  - url: http://localhost:8090/siga/api/v1
    description: Local

tags:
  - name: Alumnos
  - name: Docentes
  - name: Representantes
  - name: Cursos
  - name: Materias
  - name: Notas
  - name: Catálogos

paths:
  /alumno/listado:
    get:
      tags: [Alumnos]
      summary: Listar alumnos activos
      operationId: listarAlumnos
      responses:
        '200':
          description: Lista de alumnos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListadoAlumnosdto'

  /alumno/consultarporcedula:
    get:
      tags: [Alumnos]
      summary: Consultar alumno por cédula
      description: Usa GET con body (no estándar). Requiere cliente compatible (Postman, curl).
      operationId: consultarAlumnoPorCedula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDocumentodto'
            example:
              tipoDocumento: V
              numeroDocumento: '12345678'
      responses:
        '200':
          description: Alumno encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '400':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
        '404':
          description: Alumno no registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'
        '500':
          description: Error de base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDb'

  /alumno/consultarporid/{id}:
    get:
      tags: [Alumnos]
      summary: Consultar alumno por ID
      operationId: consultarAlumnoPorId
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Alumno encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '404':
          description: No encontrado

  /alumno/crear:
    post:
      tags: [Alumnos]
      summary: Crear alumno
      operationId: crearAlumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alumnodto'
      responses:
        '201':
          description: Alumno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '400':
          description: Validación fallida o cédula duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeError'

  /alumno/modificar/{idAlumno}:
    put:
      tags: [Alumnos]
      summary: Modificar alumno
      operationId: modificarAlumno
      parameters:
        - name: idAlumno
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alumnodto'
      responses:
        '200':
          description: Alumno actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alumno'
        '204':
          description: Cédula duplicada en otro alumno

  /alumno/desactivar/{idAlumno}/{condicion}:
    put:
      tags: [Alumnos]
      summary: Desactivar alumno
      operationId: desactivarAlumno
      parameters:
        - name: idAlumno
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: condicion
          in: path
          required: true
          schema:
            type: string
          example: RETIRADO
      responses:
        '204':
          description: Alumno desactivado

  /alumno/consultaralumnosporcurso:
    get:
      tags: [Alumnos]
      summary: Listar alumnos por curso
      operationId: alumnosPorCurso
      parameters:
        - name: idcurso
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de alumnos del curso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alumno'
        '404':
          description: Sin alumnos en el curso

  /docente/listado:
    get:
      tags: [Docentes]
      summary: Listar docentes activos
      operationId: listarDocentes
      responses:
        '200':
          description: Lista de docentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Docente'

  /docente/crear:
    post:
      tags: [Docentes]
      summary: Crear docente
      operationId: crearDocente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Docentedto'
      responses:
        '201':
          description: Docente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '204':
          description: Cédula duplicada

  /docente/modificar/{idDocente}:
    put:
      tags: [Docentes]
      summary: Modificar docente
      operationId: modificarDocente
      parameters:
        - name: idDocente
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Docentedto'
      responses:
        '200':
          description: Docente actualizado
        '204':
          description: Cédula duplicada en otro docente

  /docente/consultarporcedula:
    get:
      tags: [Docentes]
      summary: Consultar docente por cédula
      description: GET con body.
      operationId: consultarDocentePorCedula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDocumentodto'
      responses:
        '200':
          description: Docente o vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'

  /docente/consultarporid/{id}:
    get:
      tags: [Docentes]
      summary: Consultar docente por ID
      operationId: consultarDocentePorId
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Docente o vacío
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'

  /docente/desactivar/{idDocente}/{condicion}:
    put:
      tags: [Docentes]
      summary: Desactivar docente
      operationId: desactivarDocente
      parameters:
        - name: idDocente
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: condicion
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Docente desactivado

  /representante/crear:
    post:
      tags: [Representantes]
      summary: Crear representante
      operationId: crearRepresentante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Representantedto'
      responses:
        '201':
          description: Representante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Representante'
        '204':
          description: Cédula duplicada

  /representante/consultarporcedula:
    post:
      tags: [Representantes]
      summary: Consultar representante por cédula
      operationId: consultarRepresentantePorCedula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDocumentodto'
      responses:
        '200':
          description: Representante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Representante'
        '404':
          description: No encontrado

  /curso/crear:
    post:
      tags: [Cursos]
      summary: Crear curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cursodto'
            example:
              annio: 1°
              seccion: A
              periodoAcademico: 2022-2023
              turno: DIURNO
              nivel: MEDIA
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '500':
          description: Curso duplicado

  /curso/listado:
    get:
      tags: [Cursos]
      summary: Listar cursos
      operationId: listarCursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

  /curso/asignardocente:
    post:
      tags: [Cursos]
      summary: Asignar docente a curso y materia
      operationId: asignarDocenteCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoDocentedto'
      responses:
        '200':
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoDocente'

  /curso/cargarcurso:
    post:
      tags: [Cursos]
      summary: Cargar alumnos en un curso
      operationId: cargarCurso
      parameters:
        - name: idcurso
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CedulaAlumnodto'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /curso/cursospordocente:
    get:
      tags: [Cursos]
      summary: Cursos asignados a un docente
      description: GET con body.
      operationId: cursosPorDocente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDocumentodto'
      responses:
        '200':
          description: Lista de asignaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoDocente'

  /materia/listado:
    get:
      tags: [Materias]
      summary: Listar nombres de materias
      operationId: listarMaterias
      responses:
        '200':
          description: Nombres distintos de materias
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /notas/crear:
    post:
      tags: [Notas]
      summary: Registrar notas parciales
      operationId: crearNotas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotasParcialesdto'
            example:
              notasParcialesdto:
                - alumnoId: 1
                  docenteId: 2
                  cursoId: 1
                  materiaId: 5
                  lapso: 1°
                  nota: '18'
                  porcentaje: null
      responses:
        '200':
          description: Notas registradas (solo las insertadas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotaParcial'

  /notas/consultar:
    get:
      tags: [Notas]
      summary: Consultar notas de un alumno
      description: GET con body.
      operationId: consultarNotas
      parameters:
        - name: lapso
          in: query
          required: false
          schema:
            type: string
          example: 1°
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaDocumentodto'
      responses:
        '200':
          description: Notas del alumno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaNotasAlumnodto'
        '404':
          description: Alumno no encontrado

  /profesiones:
    get:
      tags: [Catálogos]
      summary: Listar profesiones
      operationId: listarProfesiones
      responses:
        '200':
          description: Catálogo de profesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profesion'

  /nacionalidades:
    get:
      tags: [Catálogos]
      summary: Listar nacionalidades
      operationId: listarNacionalidades
      responses:
        '200':
          description: Catálogo de nacionalidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Nacionalidad'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    PersonaDocumentodto:
      type: object
      required: [tipoDocumento, numeroDocumento]
      properties:
        tipoDocumento:
          type: string
          example: V
        numeroDocumento:
          type: string
          example: '12345678'

    MensajeError:
      type: object
      properties:
        mensaje:
          type: string

    ErrorDb:
      type: object
      properties:
        mensaje:
          type: string
        error:
          type: string

    ListadoAlumnosdto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        cursoAnnio:
          type: string
        cursoSeccion:
          type: string
        cursoPeriodoAcademico:
          type: string
        cursoTurno:
          type: string
        cursoNivel:
          type: string

    Cursodto:
      type: object
      properties:
        annio:
          type: string
        seccion:
          type: string
        periodoAcademico:
          type: string
        turno:
          type: string
        nivel:
          type: string

    CursoDocentedto:
      type: object
      properties:
        cursoId:
          type: integer
          format: int64
        materiaId:
          type: integer
          format: int64
        docenteId:
          type: integer
          format: int64

    CedulaAlumnodto:
      type: object
      properties:
        cedulas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaDocumentodto'

    NotaParcialdto:
      type: object
      properties:
        alumnoId:
          type: integer
          format: int64
        docenteId:
          type: integer
          format: int64
        cursoId:
          type: integer
          format: int64
        materiaId:
          type: integer
          format: int64
        lapso:
          type: string
        nota:
          type: string
        porcentaje:
          type: string
          nullable: true

    NotasParcialesdto:
      type: object
      properties:
        notasParcialesdto:
          type: array
          items:
            $ref: '#/components/schemas/NotaParcialdto'

    NotaConsultadto:
      type: object
      properties:
        materia:
          type: string
        nota:
          type: string
        lapso:
          type: string
        porcentaje:
          type: string

    ConsultaNotasAlumnodto:
      type: object
      properties:
        tipoDocumentoAlumno:
          type: string
        numeroDocumentoAlumno:
          type: string
        primerNombreAlumno:
          type: string
        segundoNombreAlumno:
          type: string
        primerApellidoAlumno:
          type: string
        segundoApellidoAlumno:
          type: string
        annio:
          type: string
        periodo:
          type: string
        seccion:
          type: string
        turno:
          type: string
        notas:
          type: array
          items:
            $ref: '#/components/schemas/NotaConsultadto'

    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
        annio:
          type: string
        seccion:
          type: string
        periodoAcademico:
          type: string
        turno:
          type: string
        nivel:
          type: string

    Profesion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        profesion:
          type: string

    Nacionalidad:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paisNac:
          type: string
        gentilicioNac:
          type: string
        isoNac:
          type: string

    Representante:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        email:
          type: string
        activo:
          type: boolean

    Representantedto:
      type: object
      properties:
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        fechaNacimieno:
          type: string
          format: date
        edad:
          type: string
        estadoCivil:
          type: string
        direccion:
          type: string
        empresaDondeTrabaja:
          type: string
        lugarDeNacimiento:
          type: string
        nacionalidad:
          type: string
        ingresoMensualAproximado:
          type: string
        direccionLaboral:
          type: string
        codigoOperadoraTelefono:
          type: string
        telefono:
          type: string
        codigoOperadoraTelefonoEmpresa:
          type: string
        telefonoEmpresa:
          type: string
        email:
          type: string
        activo:
          type: boolean
        profesion:
          type: string
        ocupacion:
          type: string

    Docente:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        email:
          type: string
        activo:
          type: boolean
        condicion:
          type: string
        pregrado1:
          type: string
        asignaturasEspecializadas:
          type: string

    Docentedto:
      type: object
      properties:
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: string
        direccion:
          type: string
        codigoOperadoraTelefono:
          type: string
        telefono:
          type: string
        email:
          type: string
        lugarDeNacimiento:
          type: string
        nacionalidad:
          type: string
        fechaIngreso:
          type: string
          format: date
        activo:
          type: boolean
        condicion:
          type: string
        estadoCivil:
          type: string
        pregrado1:
          type: string
        pregrado2:
          type: string
        postgrado1:
          type: string
        postgrado2:
          type: string
        curso1:
          type: string
        curso2:
          type: string
        curso3:
          type: string
        curso4:
          type: string
        graduadoPregrado1:
          type: string
        categoria:
          type: string
        tiempoDeServicio:
          type: integer
        asignaturasEspecializadas:
          type: string

    Alumno:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: string
        direccion:
          type: string
        telefono:
          type: string
        email:
          type: string
        parentesco:
          type: string
        numeroLista:
          type: integer
          format: int64
        activo:
          type: boolean
        condicion:
          type: string
        representante:
          $ref: '#/components/schemas/Representante'
        curso:
          $ref: '#/components/schemas/Curso'

    Alumnodto:
      type: object
      description: Incluye datos del alumno, representante (prefijo representante*) y curso (prefijo curso*).
      properties:
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string
        primerNombre:
          type: string
        segundoNombre:
          type: string
        primerApellido:
          type: string
        segundoApellido:
          type: string
        sexo:
          type: string
        fechaNacimiento:
          type: string
          format: date
        edad:
          type: string
        direccion:
          type: string
        codigoOperadoraTelefono:
          type: string
        telefono:
          type: string
        email:
          type: string
        fechaIngreso:
          type: string
          format: date
        lugarDeNacimiento:
          type: string
        nacionalidad:
          type: string
        representanteTipoDocumento:
          type: string
        representanteNumeroDocumento:
          type: string
        representantePrimerNombre:
          type: string
        representanteSegundoNombre:
          type: string
        representantePrimerApellido:
          type: string
        representanteSegundoApellido:
          type: string
        representanteSexo:
          type: string
        representanteFechaNacimieno:
          type: string
          format: date
        representanteEdad:
          type: string
        representanteEstadoCivil:
          type: string
        representanteDireccion:
          type: string
        representanteLugarDeNacimiento:
          type: string
        representanteNacionalidad:
          type: string
        representanteIngresoMensualAproximado:
          type: string
        representanteEmpresaDondeTrabaja:
          type: string
        representanteDireccionLaboral:
          type: string
        representanteCodigoOperadoraTelefono:
          type: string
        representanteTelefono:
          type: string
        representanteCodigoOperadoraTelefonoEmpresa:
          type: string
        representanteTelefonoEmpresa:
          type: string
        representanteEmail:
          type: string
        representanteActivo:
          type: boolean
        representanteProfesion:
          type: string
        representanteOcupacion:
          type: string
        parentesco:
          type: string
        cursoAnnio:
          type: string
        cursoSeccion:
          type: string
        cursoPeriodoAcademico:
          type: string
        cursoTurno:
          type: string
        cursoNivel:
