services:
  siga_db:
    container_name: siga_db
    image: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=siga
      - MYSQL_USER=user
      - MYSQL_PASSWORD=sigadbpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_db:/var/lib/mysql
  siga-api:
    container_name: siga-api
    image: siga-api:1.0.0
    build: .
    ports:
      - "8080:8080"
    environment:
      - SIGA_DB_USERNAME
      - SIGA_DB_PASSWORD
      - SIGA_DB_SERVERNAME
      - SIGA_DB_PORT
      - SIGA_DB_NAME
    depends_on:
      - siga_db
    volumes:
        - ./src:/app/src
    restart: always
volumes:
  mysql_db:
    driver: local







